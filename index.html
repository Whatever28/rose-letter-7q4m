:root{color-scheme:dark;--ink:#100b12;--pink:#f3bad0;--light:#fbe7ed;--muted:#b48c9d}
*{box-sizing:border-box}
html{min-width:280px;min-height:100%;background:var(--ink)}
body{margin:0;min-height:100svh;color:var(--light);background:radial-gradient(ellipse at 50% 43%,#2b1527 0%,#190e1b 34%,#100b12 72%);font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:20px;border:1px solid #f4b2ce14;pointer-events:none;z-index:4}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#08060b80);z-index:1}
main{position:relative;z-index:2;max-width:980px;margin:auto;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px 24px 34px;text-align:center}
.dedication{display:flex;align-items:center;gap:17px;font:400 15px/1.5 Georgia,serif;letter-spacing:.18em;color:#e3b9c9;margin:0 0 2px}
.dedication::before,.dedication::after{content:"";width:38px;height:1px;background:linear-gradient(90deg,transparent,#ad728c80)}
.dedication::after{transform:rotate(180deg)}
.name{font-family:'Rose Serif',Georgia,serif;font-size:clamp(30px,5vw,44px);font-weight:400;line-height:1.1;letter-spacing:.025em;margin:4px 0 0;color:#f7dbe5}
.bouquet{position:relative;width:min(100%,700px);margin:-10px 0 -35px;aspect-ratio:900/720;isolation:isolate}
.bouquet::before{content:"";position:absolute;inset:16% 20% 18%;border-radius:50%;background:#b02d6c;opacity:.065;filter:blur(55px);z-index:-1}
canvas{display:block;width:100%;height:100%;filter:brightness(1.6) saturate(1.08) drop-shadow(0 0 8px #cf679725)}
.message{position:relative;opacity:0;transform:translateY(12px);transition:opacity 1.6s ease,transform 1.6s ease}
.ready .message{opacity:1;transform:none}
h1{font-family:'Rose Serif',Georgia,serif;font-weight:400;font-style:italic;font-size:clamp(48px,8vw,82px);line-height:1.12;letter-spacing:-.025em;color:#ffe7ee;text-shadow:0 0 35px #e76ba22b;margin:0}
.ornament{display:flex;align-items:center;justify-content:center;gap:14px;color:#d199b0;font:18px/1.4 Georgia,serif;margin-top:17px}
.ornament::before,.ornament::after{content:"";height:1px;width:66px;background:linear-gradient(90deg,transparent,#be79925c)}
.ornament::after{transform:rotate(180deg)}
.caption{font:400 19px/1.5 'Rose Serif',Georgia,serif;color:#cea6b8;letter-spacing:.025em;margin:9px 0 0}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:28px}
button{appearance:none;-webkit-tap-highlight-color:transparent;border:1px solid #d28da64d;border-radius:100px;background:#2a182433;color:#e9c1d0;min-height:46px;padding:11px 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font:400 14px/1.4 Georgia,serif;cursor:pointer;transition:background .25s,border-color .25s,transform .25s}
button:hover{background:#8e426029;border-color:#e9a3c17f;transform:translateY(-1px)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid #f8c7d9;outline-offset:5px}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.pause{width:46px;padding:0}
.pause .play-icon{display:none}
.paused .pause .pause-icon{display:none}
.paused .pause .play-icon{display:block}
.hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.heart{position:absolute;left:var(--x);bottom:-40px;color:#e7a1bd;font:var(--size)/1 Georgia,serif;opacity:0;animation:float-heart var(--duration) var(--delay) linear infinite;will-change:transform,opacity}
@keyframes float-heart{0%{opacity:0;transform:translate3d(0,0,0) rotate(-12deg)}12%{opacity:var(--alpha)}80%{opacity:var(--alpha)}100%{opacity:0;transform:translate3d(var(--drift),-110vh,0) rotate(18deg)}}
.paused .heart{animation-play-state:paused}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
noscript p{font:16px/1.6 Georgia,serif;max-width:32em;margin:2em auto;color:#dcb1c3}
@media(min-width:1000px) and (min-height:850px){main{padding-top:50px;padding-bottom:45px}.bouquet{width:760px;margin-top:0;margin-bottom:-25px}.controls{margin-top:32px}}
@media(max-width:520px){body::before{inset:11px}main{padding:38px 17px 30px;justify-content:center}.dedication{font-size:14px;gap:13px}.name{margin-top:6px}.bouquet{width:calc(100% + 16px);margin:9px -8px -8px}.caption{font-size:19px}.controls{margin-top:25px}h1{font-size:clamp(43px,12.5vw,65px)}.ornament{margin-top:14px}}
@media(max-height:650px) and (min-width:600px){main{padding-top:25px;padding-bottom:25px}.bouquet{width:460px;margin-top:-10px;margin-bottom:-36px}.name{font-size:30px}h1{font-size:54px}.ornament{margin-top:8px}.caption{margin-top:4px}.controls{margin-top:16px}}
@media(prefers-reduced-motion:reduce){.heart{display:none}.message{opacity:1;transform:none;transition:none}button{transition:none}}
</style>
</head>
<body>
<div class="hearts" aria-hidden="true"></div>
<main>
  <div class="bouquet" role="img" aria-label="Букет из семи детализированных розовых роз, нарисованных текстовыми символами">
    <canvas id="roses" width="900" height="720" aria-hidden="true"></canvas>
  </div>
  <div class="message"><h1>Люблю Тебя</h1><div class="ornament" aria-hidden="true">♡</div></div>
  <div class="controls">
    <button id="replay" class="pause" type="button" aria-label="Повторить анимацию букета"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.7 7.2M4 4v6h6"/></svg></button>
    <button id="pause" class="pause" type="button" aria-label="Приостановить анимацию" aria-pressed="false"><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg></button>
  </div>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  <noscript><style>.message{opacity:1;transform:none}.controls,.bouquet{display:none}</style></noscript>
</main>
<script>
'use strict';
(() => {
  const canvas = document.getElementById('roses');
  const ctx = canvas.getContext('2d');
  const W = 900, H = 720, CW = 4.5, CH = 6;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const replay = document.getElementById('replay');
  const pause = document.getElementById('pause');
  const status = document.getElementById('status');
  let paused = false, frame = 0, elapsed = 0, previous = 0, announced = false;
  let seed = 427;
  const random = () => {seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646;};
  const layers = [];
  const flowers = [
    {x:448,y:150,r:83,a:-.13},
    {x:287,y:218,r:84,a:-.38},
    {x:608,y:225,r:87,a:.25},
    {x:158,y:345,r:78,a:-.52},
    {x:745,y:351,r:79,a:.48},
    {x:347,y:390,r:92,a:-.14},
    {x:553,y:399,r:94,a:.16}
  ];
  function makeLayer(draw, delay, duration, kind) {
    const off = document.createElement('canvas'); off.width=W; off.height=H;
    const c = off.getContext('2d', {willReadFrequently:true}); draw(c);
    const pix = c.getImageData(0,0,W,H).data, chars=[];
    for(let y=3;y<H;y+=CH) for(let x=2;x<W;x+=CW) {
      const xx=Math.floor(x), yy=Math.floor(y), at=(yy*W+xx)*4;
      if(pix[at+3]<70) continue;
      const r=pix[at],g=pix[at+1],b=pix[at+2];
      const light=.2126*r+.7152*g+.0722*b;
      const glyphs=kind==='rose' ? (light>200?"*o@":light>160?"/()\\*":light>120?"+*=":light>85?";:":".,") : ":;|/()";
      chars.push({x,y,ch:glyphs[Math.floor(random()*glyphs.length)],color:`rgb(${r},${g},${b})`,t:kind==='rose'?(y/H*.26+random()*.74):((H-y)/H*.8+random()*.2)});
    }
    const cache=document.createElement('canvas');cache.width=W*2;cache.height=H*2;
    const cc=cache.getContext('2d');cc.scale(2,2);cc.font='6.5px "Courier New", monospace';cc.textAlign='center';cc.textBaseline='middle';
    for(const p of chars){cc.fillStyle=p.color;cc.fillText(p.ch,p.x,p.y);}
    layers.push({chars,delay,duration,kind,cache});
  }
  function leaf(c,x,y,angle,size) {
    c.save();c.translate(x,y);c.rotate(angle);
    const g=c.createLinearGradient(0,-size*.3,size,0);g.addColorStop(0,'#69967f');g.addColorStop(.45,'#486d5a');g.addColorStop(1,'#1b382d');
    c.fillStyle=g;c.beginPath();c.moveTo(0,0);c.bezierCurveTo(size*.25,-size*.48,size*.76,-size*.48,size,0);c.bezierCurveTo(size*.65,size*.35,size*.3,size*.35,0,0);c.fill();
    c.strokeStyle='#83a38b';c.lineWidth=1.6;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(size*.5,-size*.05,size*.97,0);c.stroke();
    c.strokeStyle='#62866f';c.lineWidth=1;for(let i=1;i<5;i++){let xx=size*i/6;c.beginPath();c.moveTo(xx,0);c.lineTo(xx+size*.12,-size*.2);c.moveTo(xx,0);c.lineTo(xx+size*.12,size*.18);c.stroke();} c.restore();
  }
  makeLayer(c=>{
    flowers.forEach((f,i)=>{
      const end=432+i*6;c.beginPath();c.moveTo(f.x,f.y+f.r*.47);c.bezierCurveTo(f.x+(450-f.x)*.18,f.y+170,450,551,end,654+(i%3)*11);
      c.strokeStyle=['#7a9d81','#8bac8e','#678c72'][i%3];c.lineWidth=5;c.stroke();
    });
    leaf(c,317,443,-2.65,102);leaf(c,570,457,-.54,105);leaf(c,387,505,-2.72,84);leaf(c,497,529,-.3,86);
    leaf(c,230,391,-2.4,78);leaf(c,661,403,-.62,77);leaf(c,435,295,-2.1,60);leaf(c,502,322,-.85,61);
  },0,2100,'stem');
  function rose(c,f,index){
    c.save();c.translate(f.x,f.y);c.rotate(f.a);c.scale(1,.88);
    c.scale(f.r/95,f.r/95);
    // Broad curled petals wrap around a folded centre, each with its own rim.
    const petals=[
      ['M-76-24 C-87-60-53-90-22-80 C-4-100 30-94 44-78 C78-81 96-51 80-23 C105 10 88 50 58 64 C23 99-29 89-58 69 C-92 56-104 15-76-24Z',-70,-80,35,80],
      ['M-67-22 C-82-55-52-83-22-79 C6-76 25-56 15-31 C-11-15-38-14-67-22Z',-40,-80,0,5],
      ['M-12-63 C11-96 64-83 77-53 C83-30 52-8 22-15 C29-39 8-48-12-63Z',30,-85,0,12],
      ['M-78-28 C-99-4-84 37-55 50 C-23 52-9 22-20-8 C-47 2-65-3-78-28Z',-75,-30,10,55],
      ['M71-37 C103-15 95 30 63 52 C35 64 11 42 15 15 C45 19 63-6 71-37Z',75,-38,10,65],
      ['M-42-40 C-33-65 0-71 26-53 C41-36 22-15 3-5 C-8-24-28-23-42-40Z',-25,-62,20,20],
      ['M-47-37 C-67-15-49 13-17 28 C8 30 23 7 6-12 C-17-2-34-14-47-37Z',-47,-38,10,35],
      ['M31-48 C60-37 67-12 42 12 C27 28 10 22-3 8 C19-3 31-20 31-48Z',45,-43,5,35],
      ['M-21-32 C-18-51 7-55 23-40 C41-21 19-4 4 1 C8-17-4-29-21-32Z',-5,-50,19,7],
      ['M-22-31 C-41-13-21 13 5 13 C26 7 28-10 14-20 C6-3-8-7-22-31Z',-22,-27,12,20],
      ['M-5-30 C9-43 26-30 20-15 C16-6 6-4 0-11 C15-11 12-24-5-30Z',0,-33,14,-4],
      ['M-64 24 C-39 41-18 48 8 27 C32 5 62 2 80-16 C87 29 51 76 12 79 C-26 85-58 62-64 24Z',-35,16,10,85],
      ['M-72 6 C-57 24-41 31-21 30 C-30 48-51 56-66 42 C-79 32-84 16-72 6Z',-70,7,-45,53],
      ['M54 30 C37 56 7 66-19 60 C-5 80 31 87 54 62 C65 49 67 38 54 30Z',35,30,5,85]
    ];
    petals.forEach(([d,x1,y1,x2,y2],i)=>{
      const p=new Path2D(d),g=c.createLinearGradient(x1,y1,x2,y2);
      g.addColorStop(0,'#ffe0ec');g.addColorStop(.22,'#efb2cc');g.addColorStop(.53,'#cc81a3');g.addColorStop(.83,'#a44e78');g.addColorStop(1,'#743355');
      c.fillStyle=g;c.fill(p);c.strokeStyle='#4c183a';c.lineWidth=4.5;c.stroke(p);
      c.save();c.clip(p);c.translate(0,3);c.strokeStyle=i>4?'#f4b2cc':'#d48caa';c.lineWidth=3;c.stroke(p);c.restore();
    });
    c.restore();
  }
  flowers.forEach((f,i)=>makeLayer(c=>rose(c,f,i),650+i*330,1700,'rose'));
  makeLayer(c=>{
    c.strokeStyle='#a6768e';c.lineWidth=6;c.beginPath();c.moveTo(424,576);c.quadraticCurveTo(452,587,475,575);c.stroke();
    c.lineWidth=3;c.beginPath();c.moveTo(452,581);c.bezierCurveTo(405,545,393,589,451,585);c.bezierCurveTo(502,548,513,592,453,584);c.moveTo(450,586);c.quadraticCurveTo(446,620,427,628);c.moveTo(455,586);c.quadraticCurveTo(465,609,486,617);c.stroke();
  },2700,900,'ribbon');
  // All visible flower marks are monospace text; no source bitmap is painted.
  ctx.font='6.5px "Courier New", monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  let dpr=1;
  function resize(){const rect=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.font='6.5px "Courier New", monospace';ctx.textAlign='center';ctx.textBaseline='middle';render();}
  function render(){
    ctx.clearRect(0,0,W,H);
    const time=reduced.matches?10000:elapsed;
    for(const layer of layers){
      const progress=Math.max(0,Math.min(1,(time-layer.delay)/layer.duration));
      if(progress<=0)continue;
      const sway=reduced.matches?0:Math.sin(time/2500)*1.6;
      ctx.save();ctx.translate(sway,0);
      if(progress>=1){ctx.drawImage(layer.cache,0,0,W,H);ctx.restore();continue;}
      for(const p of layer.chars){
        const alpha=Math.min(1,Math.max(0,(progress-p.t*.8)*5));if(alpha<=0)continue;
        ctx.globalAlpha=alpha;ctx.fillStyle=p.color;ctx.fillText(p.ch,p.x,p.y);
      }
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  function finish(){if(announced)return;announced=true;document.body.classList.add('ready');status.textContent='Люблю Тебя';}
  function tick(now){frame=0;if(paused||document.hidden)return;if(previous)elapsed+=Math.min(now-previous,100);previous=now;render();if(elapsed>4300||reduced.matches)finish();if(!reduced.matches)frame=requestAnimationFrame(tick);}
  function start(){if(frame)cancelAnimationFrame(frame);previous=0;if(!paused&&!document.hidden)frame=requestAnimationFrame(tick);}
  function setPaused(value){paused=value;document.body.classList.toggle('paused',value);pause.setAttribute('aria-pressed',String(value));pause.setAttribute('aria-label',value?'Продолжить анимацию':'Приостановить анимацию');if(value){cancelAnimationFrame(frame);frame=0;previous=0;}else start();}
  replay.addEventListener('click',()=>{elapsed=0;announced=false;status.textContent='Букет распускается заново.';document.body.classList.remove('ready');setPaused(false);if(reduced.matches){render();finish();}});
  pause.addEventListener('click',()=>setPaused(!paused));
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;previous=0;}else start();});
  reduced.addEventListener('change',()=>{if(reduced.matches){cancelAnimationFrame(frame);frame=0;render();finish();}else start();});
  const hearts=document.querySelector('.hearts');
  for(let i=0;i<16;i++){
    const h=document.createElement('span');h.className='heart';h.textContent=i%4?'♡':'♥';
    h.style.cssText=`--x:${5+random()*90}%;--size:${10+random()*12}px;--duration:${14+random()*13}s;--delay:${-random()*25}s;--alpha:${.08+random()*.19};--drift:${-45+random()*90}px`;
    hearts.append(h);
  }
  new ResizeObserver(resize).observe(canvas);resize();start();
})();
</script>
</body>
</html>
